<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NagarAI - Civic Intake</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>NagarAI Civic Intake</h1>
        
        <!-- Voice Complaint Section -->
        <div class="card">
            <h2>1. Voice Complaint</h2>
            <div class="card">
    <h2>1. Voice Complaint (Mic Record)</h2>
    <button type="button" id="startRec">🎤 Start Recording</button>
    <button type="button" id="stopRec" disabled>⏹️ Stop & Submit</button>
    <p id="recStatus">Click Start to record your complaint...</p>
</div>
            <form id="voiceForm">
                <input type="file" id="audioFile" accept="audio/*" required>
                <button type="submit">Submit Voice Complaint</button>
            </form>
        </div>

        <!-- Text Complaint Section -->
        <div class="card">
            <h2>2. Text Complaint</h2>
            <form id="textForm">
                <textarea id="textInput" placeholder="Describe the issue..." required></textarea>
                <button type="submit">Submit Text Complaint</button>
            </form>
        </div>

        <!-- Submission Status Output -->
        <div id="status" class="status-box"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
